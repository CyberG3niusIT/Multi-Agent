name: Pause noisy failing workflows

on:
  push:
    paths:
      - ".github/workflows/pause-noisy-workflows.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Disable noisy workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          for wf in \
            cve-audit.yml \
            metaharness-pin-drift.yml
          do
            echo "Disabling $wf"
            gh api --method PUT "repos/$REPO/actions/workflows/$wf/disable" \
              && echo "Disabled: $wf" \
              || echo "::warning::Could not disable $wf"
          done
          echo "Disabling helper workflow"
          gh api --method PUT "repos/$REPO/actions/workflows/pause-noisy-workflows.yml/disable" || true
